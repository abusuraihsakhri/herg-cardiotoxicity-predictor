name: Python tests and package checks

on:
  push:
    branches: [master, "audit/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents herg_guard cli.py enrichment.py simulator.py
      - name: Run regression suite
        env:
          AUDIT_SECRET_KEY: "ci-only-deterministic-test-audit-key"
        run: python -m pytest -q
